<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry-go-round Orbital Dynamics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Londrina+Sketch&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/roughjs@latest/bundled/rough.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ... (styles remain unchanged) ... */
    </style>
</head>
<body>
    <!-- ... (HTML structure remains unchanged) ... -->

    <script>
        window.LOG_DEBUG = false;

        function logDebug(message) {
            if (window.LOG_DEBUG) {
                console.log(`DEBUG [${new Date().toISOString()}]: ${message}`);
            }
        }

        const canvas = document.getElementById('roughCanvas');
        const ctx = canvas.getContext('2d');
        const rc = rough.canvas(canvas);
        
        let isSpinning = false;
        let angle = 0;
        let radius = 100;
        let mass = 50;
        let angularVelocity = 0;
        
        const centerX = 300;
        const centerY = 200;
        
        function drawMerryGoRound() {
            rc.circle(centerX, centerY, 180, { fill: 'yellow', fillStyle: 'solid', roughness: 1 });
            rc.circle(centerX, centerY, 20, { fill: 'red', fillStyle: 'solid', roughness: 0.5 });
            rc.line(centerX - 90, centerY, centerX + 90, centerY, { roughness: 1 });
            rc.line(centerX, centerY - 90, centerX, centerY + 90, { roughness: 1 });
        }
        
        function drawStudent() {
            const x = centerX + radius * Math.cos(angle);
            const y = centerY + radius * Math.sin(angle);
            rc.circle(x, y, 15, { fill: 'orange', fillStyle: 'solid', roughness: 0.5 });
            rc.rectangle(x - 10, y + 15, 20, 40, { fill: 'blue', fillStyle: 'solid', roughness: 0.5 });
            rc.line(x - 10, y + 55, x - 15, y + 75, { roughness: 0.5 });
            rc.line(x + 10, y + 55, x + 15, y + 75, { roughness: 0.5 });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMerryGoRound();
            drawStudent();
        }
        
        function update() {
            if (isSpinning) {
                angle += angularVelocity;
                if (angle > 2 * Math.PI) {
                    angle -= 2 * Math.PI;
                }
            }
            draw();
            updateDisplays();
            requestAnimationFrame(update);
        }
        
        function updateDisplays() {
            const speedDisplay = document.getElementById('speedDisplay');
            const energyDisplay = document.getElementById('energyDisplay');
            const momentumDisplay = document.getElementById('momentumDisplay');
            
            speedDisplay.textContent = `Angular Velocity: ${angularVelocity.toFixed(2)} rad/s`;
            
            const rotationalEnergy = 0.5 * mass * Math.pow(radius / 100, 2) * Math.pow(angularVelocity, 2);
            energyDisplay.textContent = `Rotational Energy: ${rotationalEnergy.toFixed(2)} J`;
            
            const angularMomentum = mass * Math.pow(radius / 100, 2) * angularVelocity;
            momentumDisplay.textContent = `Angular Momentum: ${angularMomentum.toFixed(2)} kg⋅m²/s`;
        }
        
        const radiusSlider = document.getElementById('radius');
        const massSlider = document.getElementById('mass');
        const startStopButton = document.getElementById('startStop');
        
        radiusSlider.addEventListener('input', () => {
            radius = parseInt(radiusSlider.value);
            updateAngularVelocity();
            logDebug(`Radius changed to ${radius}`);
        });
        
        massSlider.addEventListener('input', () => {
            mass = parseInt(massSlider.value);
            updateAngularVelocity();
            logDebug(`Mass changed to ${mass}`);
        });
        
        startStopButton.addEventListener('click', () => {
            isSpinning = !isSpinning;
            startStopButton.textContent = isSpinning ? 'Stop' : 'Start';
            if (isSpinning) {
                updateAngularVelocity();
            }
            logDebug(`Spinning ${isSpinning ? 'started' : 'stopped'}`);
        });
        
        function updateAngularVelocity() {
            // Simplified formula: v = sqrt(G * M / r), where G is a constant
            const G = 0.1; // Adjusted for visualization purposes
            angularVelocity = Math.sqrt(G * mass / (radius / 100));
            updateGraph();
            logDebug(`Angular velocity updated to ${angularVelocity}`);
        }
        
        const graphCtx = document.getElementById('graph').getContext('2d');
        let chart;
        
        function createGraph() {
            chart = new Chart(graphCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Angular Velocity vs Radius',
                        data: [],
                        borderColor: 'rgb(75, 192, 192)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Radius (m)'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Angular Velocity (rad/s)'
                            }
                        }
                    }
                }
            });
        }
        
        function updateGraph() {
            const radiusValues = [];
            const velocityValues = [];
            for (let r = 50; r <= 200; r += 10) {
                radiusValues.push(r);
                const v = Math.sqrt(0.1 * mass / (r / 100));
                velocityValues.push(v);
            }
            chart.data.labels = radiusValues;
            chart.data.datasets[0].data = velocityValues;
            chart.update();
            logDebug('Graph updated');
        }
        
        createGraph();
        updateAngularVelocity();
        update();

        document.addEventListener('DOMContentLoaded', () => {
            if (window.LOG_DEBUG) {
                logDebug('Simulation initialized');
                document.querySelectorAll('svg').forEach((svg, index) => {
                    const rect = svg.getBoundingClientRect();
                    logDebug(`SVG #${index}: Position {x: ${rect.x}, y: ${rect.y}}, Size {w: ${rect.width}, h: ${rect.height}}`);
                });
                document.querySelectorAll('input, button, select').forEach((control) => {
                    logDebug(`Control ${control.id || 'unnamed'} (${control.tagName}): Initial value: ${control.value || 'N/A'}`);
                });
                
                document.querySelectorAll('button').forEach((button) => {
                    button.addEventListener('click', () => logDebug(`Button ${button.id || 'unnamed'} clicked`));
                });
                document.querySelectorAll('input').forEach((input) => {
                    input.addEventListener('change', (e) => logDebug(`Input ${input.id || 'unnamed'} changed to ${e.target.value}`));
                });
            }
        });
    </script>
</body>
</html>
