<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyclist Energy Metabolism Simulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Londrina+Sketch&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/roughjs@latest/bundled/rough.js"></script>
    <style>
        body {
            font-family: 'Cabin Sketch', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }
        h1 {
            font-family: 'Cabin Sketch', cursive;
            font-weight: 700;
            color: #2c3e50;
        }
        #simulationCanvas {
            border: 2px solid #2c3e50;
            margin-bottom: 20px;
        }
        #controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input[type="range"] {
            width: 150px;
        }
        #dataDisplay {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
        }
        .data-item {
            text-align: center;
        }
        .data-value {
            font-size: 24px;
            font-weight: bold;
        }
        #timeValue {
            text-align: center;
            font-weight: bold;
        }
        #dietInfo {
            margin-top: 20px;
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Cyclist Energy Metabolism Simulation</h1>
    <p>Explore how a cyclist's energy metabolism changes during exercise. Select a cyclist, choose their diet, and observe how their energy production and waste products change over time.</p>
    <canvas id="simulationCanvas" width="600" height="400"></canvas>
    <div id="controls">
        <div class="control-group">
            <label for="cyclistSelect">Cyclist:</label>
            <select id="cyclistSelect">
                <option value="sprinter">Sprinter</option>
                <option value="endurance">Endurance Cyclist</option>
            </select>
        </div>
        <div class="control-group">
            <label for="dietSelect">Diet:</label>
            <select id="dietSelect">
                <option value="balanced">Balanced</option>
                <option value="highCarb">High Carbohydrate</option>
                <option value="highFat">High Fat</option>
            </select>
        </div>
        <div class="control-group">
            <label for="timeSlider">Time (minutes):</label>
            <input type="range" id="timeSlider" min="0" max="60" value="0">
            <div id="timeValue">0</div>
        </div>
    </div>
    <div id="dataDisplay">
        <div class="data-item">
            <div>Energy (ATP)</div>
            <div id="atpValue" class="data-value">0</div>
        </div>
        <div class="data-item">
            <div>CO2 Exhaled</div>
            <div id="co2Value" class="data-value">0</div>
        </div>
        <div class="data-item">
            <div>Muscle Fatigue</div>
            <div id="lacticAcidValue" class="data-value">0</div>
        </div>
    </div>
    <div id="dietInfo"></div>
    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        const rc = rough.canvas(canvas);

        const cyclistSVG = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" fill="#3498db"/>
                <circle cx="50" cy="50" r="35" fill="#2980b9"/>
                <path d="M30,50 Q50,30 70,50 Q50,70 30,50" fill="#ecf0f1"/>
            </svg>
        `;

        let cyclist = {
            x: 300,
            y: 200,
            speed: 0,
            energy: 0,
            co2: 0,
            lacticAcid: 0
        };

        function drawCyclist() {
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, cyclist.x - 50, cyclist.y - 50, 100, 100);
            }
            img.src = 'data:image/svg+xml;base64,' + btoa(cyclistSVG);
        }

        function drawMetabolismVisuals() {
            // Draw ATP molecules
            for (let i = 0; i < Math.min(cyclist.energy, 20); i++) {
                rc.circle(30 + i * 30, 350, 10, { fill: 'yellow', fillStyle: 'solid' });
            }

            // Draw CO2 molecules
            for (let i = 0; i < Math.min(cyclist.co2, 20); i++) {
                rc.circle(570 - i * 30, 350, 10, { fill: 'gray', fillStyle: 'solid' });
            }

            // Draw lactic acid indicator
            rc.rectangle(250, 380, 100, 10, { fill: 'red', fillStyle: 'solid' });
            rc.rectangle(250, 380, cyclist.lacticAcid * 10, 10, { fill: 'darkred', fillStyle: 'solid' });
        }

        function updateSimulation() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            rc.rectangle(0, 300, 600, 100, {
                fill: 'green',
                fillStyle: 'solid',
                roughness: 2
            });

            drawCyclist();
            drawMetabolismVisuals();

            cyclist.x += cyclist.speed;
            if (cyclist.x > 600) cyclist.x = 0;

            document.getElementById('atpValue').textContent = cyclist.energy.toFixed(2);
            document.getElementById('co2Value').textContent = cyclist.co2.toFixed(2);
            document.getElementById('lacticAcidValue').textContent = cyclist.lacticAcid.toFixed(2);

            requestAnimationFrame(updateSimulation);
        }

        function updateMetabolism() {
            const cyclistType = document.getElementById('cyclistSelect').value;
            const diet = document.getElementById('dietSelect').value;
            const time = parseInt(document.getElementById('timeSlider').value);

            let baseEnergy = cyclistType === 'sprinter' ? 10 : 5;
            let baseCO2 = cyclistType === 'sprinter' ? 5 : 8;
            let baseLacticAcid = cyclistType === 'sprinter' ? 8 : 3;

            if (diet === 'highCarb') {
                baseEnergy *= 1.2;
                baseCO2 *= 1.3;
            } else if (diet === 'highFat') {
                baseEnergy *= 0.9;
                baseCO2 *= 0.8;
                baseLacticAcid *= 0.7;
            }

            cyclist.energy = baseEnergy * (1 + time / 30);
            cyclist.co2 = baseCO2 * (1 + time / 20);
            cyclist.lacticAcid = baseLacticAcid * (1 + time / 40);
            cyclist.speed = baseEnergy / 10;

            // Implement anaerobic threshold
            if (time > 30 && cyclistType === 'sprinter') {
                cyclist.lacticAcid *= 1.5;
                cyclist.energy *= 0.8;
            }

            // Implement aerobic efficiency for endurance cyclist
            if (time > 30 && cyclistType === 'endurance') {
                cyclist.energy *= 1.2;
                cyclist.co2 *= 0.9;
            }

            document.getElementById('timeValue').textContent = time;

            updateDietInfo(diet);
        }

        function updateDietInfo(diet) {
            const dietInfo = document.getElementById('dietInfo');
            switch (diet) {
                case 'balanced':
                    dietInfo.textContent = 'Balanced diet provides steady energy production.';
                    break;
                case 'highCarb':
                    dietInfo.textContent = 'High carb diet increases energy production but also CO2 output.';
                    break;
                case 'highFat':
                    dietInfo.textContent = 'High fat diet slightly decreases energy production but reduces lactic acid buildup.';
                    break;
            }
        }

        document.getElementById('cyclistSelect').addEventListener('change', updateMetabolism);
        document.getElementById('dietSelect').addEventListener('change', updateMetabolism);
        document.getElementById('timeSlider').addEventListener('input', updateMetabolism);

        updateMetabolism();
        updateSimulation();
    </script>
</body>
</html>
