<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulation Gallery</title>

  <link href="https://fonts.googleapis.com/css?family=Google+Sans:400,700|Noto+Sans:400,600" rel="stylesheet">
  <link rel="stylesheet" href="./static/css/bulma.min.css">
  <link rel="stylesheet" href="./static/css/fontawesome.all.min.css">
  <link rel="icon" href="./static/images/favicon.svg">

  <style>
    body {
      font-family: 'Noto Sans', Arial, sans-serif;
      color: #2b2b2b;
    }

    .navbar {
      border-bottom: 1px solid #eee;
    }

    .navbar-item.is-active {
      font-weight: 700;
      color: #222 !important;
    }

    .gallery-title {
      margin-bottom: 2rem;
    }

    .search-bar {
      margin-bottom: 1.5rem;
    }

    .sim-card {
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      transition: transform .15s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sim-card:hover {
      transform: translateY(-4px);
    }

    .thumb-html {
      background: linear-gradient(135deg, #f7fbff, #eaf2ff);
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
    }

    .thumb-title {
      font: 700 1.25rem/1.3 'Google Sans', Arial, sans-serif;
      text-align: center;
      color: #0f172a;
    }

    .sim-body {
      padding: 1rem 1.25rem 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .sim-subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 1rem;
      text-align: center;
    }

    .sim-footer {
      margin-top: auto;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar is-light" role="navigation" aria-label="main navigation">
    <div class="container is-max-desktop">
      <div class="navbar-brand">
        <a class="navbar-item" href="index.html" style="font-weight:700;">SimStep</a>
        <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="mainNav">
          <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
        </a>
      </div>

      <div id="mainNav" class="navbar-menu">
        <div class="navbar-start">
          <a class="navbar-item" href="index.html">Home</a>
          <a class="navbar-item is-active" href="gallery.html">Gallery</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===== GALLERY ===== -->
  <section class="section">
    <div class="container is-max-desktop">
      <h1 class="title is-2 gallery-title">Simulation Gallery</h1>
      <input id="search" class="input search-bar" type="text" placeholder="Filter by title...">
      <div id="gallery" class="columns is-multiline"></div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container">
      <div class="content has-text-centered">
        <p>
          This website is licensed under a
          <a rel="license" href="http://creativecommons.org/licenses/by-sa/4.0/">
            Creative Commons Attribution-ShareAlike 4.0 International License
          </a>.
        </p>
      </div>
    </div>
  </footer>

  <!-- ===== SCRIPT ===== -->
  <script>
    (async () => {
      const ROOT_PATH = "./static/eval-simulations";
      const galleryEl = document.getElementById("gallery");
      const searchEl = document.getElementById("search");

      const res = await fetch(`${ROOT_PATH}/manifest.json`);
      if (!res.ok) { galleryEl.innerHTML = "<p>Failed to load simulations.</p>"; return; }
      let items = await res.json();
      if (!Array.isArray(items)) return;

      // Sort by title
      items.sort((a, b) => a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: 'base' }));

      function render(list) {
        galleryEl.innerHTML = "";
        list.forEach(it => {
          const simURL = `${ROOT_PATH}/${it.slug}/fullpipeline/simulation.html`;
          const card = document.createElement("div");
          card.className = "column is-one-third";
          card.innerHTML = `
          <div class="sim-card">
            <div class="thumb-html">
              <div class="thumb-title">${it.title}</div>
            </div>
            <div class="sim-body">
              <div class="sim-subtitle">${it.slug.replace(/_/g, ' ')}</div>
              <div class="sim-footer">
                <a class="button is-dark is-rounded is-small" href="${simURL}" target="_blank">Open Simulation</a>
              </div>
            </div>
          </div>`;
          galleryEl.appendChild(card);
        });
      }

      render(items);

      searchEl.addEventListener("input", e => {
        const q = e.target.value.toLowerCase();
        const filtered = items.filter(it =>
          it.title.toLowerCase().includes(q) || it.slug.toLowerCase().includes(q)
        );
        render(filtered);
      });
    })();
  </script>
</body>

</html>
